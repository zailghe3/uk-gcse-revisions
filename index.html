<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#244b40">
  <title>My GCSE Study Plan</title>
  <style>
    /* ==================== STYLES / TOKENS ==================== */
    :root { --ink:#203a33; --muted:#687a74; --paper:#f4f2eb; --card:#fff; --line:#dcded7; --brand:#285649; --soft:#eaf2ee; --warm:#fff7e6; --focus:#1769aa; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--paper); }
    * { box-sizing:border-box; }
    body { margin:0; }
    button,input,select,textarea { font:inherit; }
    button,.button { min-height:44px; border:1px solid #cfd5d1; border-radius:9px; background:#fff; color:var(--ink); padding:9px 14px; font-weight:650; cursor:pointer; }
    button:hover,.button:hover { border-color:#6e8d83; } button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    button.primary { background:var(--brand); color:#fff; border-color:var(--brand); } button.danger { color:#8a3027; }
    .site-header { background:#fff; border-bottom:1px solid var(--line); padding:12px max(20px,calc((100vw - 1400px)/2)); display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:11px; } .brand-mark { width:42px;height:42px;display:grid;place-items:center;background:var(--brand);color:#fff;border-radius:12px;font-size:21px; }
    .brand h1 { margin:0;font-family:Georgia,serif;font-size:22px; } .brand p { margin:1px 0;color:var(--muted);font-size:12px; }
    nav { display:flex;background:#f0f2ee;border-radius:11px;padding:4px; } nav button { border:0;background:transparent; } nav button.active { background:#fff;box-shadow:0 1px 5px #0002; }
    main { max-width:1400px;margin:auto;padding:20px; } .hidden { display:none!important; } .eyebrow { letter-spacing:.16em;font-size:11px;font-weight:800;text-transform:uppercase; }
    .today { background:var(--brand);color:#fff;border-radius:18px;padding:24px;display:grid;grid-template-columns:240px 1fr auto;gap:24px;align-items:start; }
    .today .eyebrow { color:#b9d7cd; }.today h2 { font:30px Georgia,serif;margin:7px 0; }.today-summary { color:#dbeae5; }.today-groups { display:grid;grid-template-columns:1fr 1fr;gap:18px; }.today-groups h3 { color:#b9d7cd;font-size:11px;letter-spacing:.13em; }
    .task-card { --subject:#668078; width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:9px;background:#fff;color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--subject);border-radius:10px;padding:10px;margin:7px 0;cursor:pointer;min-height:58px; }
    .task-card:hover { box-shadow:0 3px 10px #193b3020; }.task-card .status { font-size:19px; }.task-card strong,.task-card small { display:block; }.task-card small { color:var(--muted);margin-top:3px; }.task-card.done { opacity:.68; }.task-card.done strong { text-decoration:line-through; }.task-card.missed { border-style:dashed;background:#fffaf0; }
    .empty { color:var(--muted);font-style:italic; }.panel { background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;margin:20px 0; }.needs { background:var(--warm);border-color:#e8d4aa; }.needs h2 { margin:0; }.count { background:#ead29f;border-radius:20px;padding:2px 9px;font-size:14px; }.recovery { border-top:1px solid #eadfca;padding:12px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap; }.recovery-info { margin-right:auto;min-width:240px; }.recovery-info small { display:block;color:var(--muted); }.recovery input { min-height:44px;border:1px solid var(--line);border-radius:8px;padding:7px; }
    .calendar-title { display:flex;justify-content:space-between;align-items:end;gap:15px; }.calendar-title h2 { font:26px Georgia,serif;margin:5px 0; }.button-row { display:flex;gap:7px;flex-wrap:wrap; }.week { margin:22px 0; }.week h3 { font-size:13px;letter-spacing:.1em;text-transform:uppercase; }.current-week>h3::before { content:"● ";color:var(--brand); }.week-days { display:grid;grid-template-columns:repeat(5,1fr);gap:9px; }.day { min-width:0;background:#ebeae4;border:1px solid #dcddd7;border-radius:11px;padding:9px; }.day.today-day { outline:3px solid #397364;background:#edf6f2; }.day header { display:flex;justify-content:space-between;font-size:12px; }.day-total { display:block;color:var(--muted);font-size:11px;margin:7px 0 3px; }.workload { height:7px;background:#d5dbd7;border-radius:9px;overflow:hidden; }.workload span { display:block;height:100%;background:#5d8c7d; }.day.overload .workload span { background:#b98245; }.calendar-task { min-height:var(--task-height); }
    .metrics { display:grid;grid-template-columns:repeat(8,1fr);gap:8px; }.metric { background:#eff3ef;border-radius:9px;padding:13px; }.metric strong,.metric span { display:block; }.metric strong { font-size:22px; }.metric span { color:var(--muted);font-size:11px; }
    .subject-progress { display:grid;grid-template-columns:repeat(2,1fr);gap:8px 24px; }.progress-row { display:grid;grid-template-columns:12px 140px 1fr 45px;align-items:center;gap:8px;font-size:12px; }.dot { width:11px;height:11px;border-radius:50%; }.progress-row progress { width:100%;accent-color:var(--brand); }
    .parent-grid { display:grid;grid-template-columns:1.12fr .88fr;gap:18px; }.editor h2,.review h2,.settings h2 { font:25px Georgia,serif; }.field-grid { display:grid;grid-template-columns:repeat(2,1fr);gap:10px; }.field { display:block;font-size:12px;font-weight:700;margin:8px 0; }.field.full { grid-column:1/-1; }.field input,.field select,.field textarea { display:block;width:100%;min-height:44px;border:1px solid #cfd4d0;border-radius:8px;padding:9px;margin-top:5px;background:#fff; }.field textarea { min-height:86px;resize:vertical; }.weekday-picker { display:flex;gap:6px;flex-wrap:wrap; }.weekday-picker label { padding:8px;border:1px solid var(--line);border-radius:7px; }.review-item { border-left:5px solid #c5725d;background:#faf5f1;padding:12px;border-radius:8px;margin:8px 0; }.review-item p { margin:4px 0; }
    .subject-edit { display:grid;grid-template-columns:48px 1.4fr .7fr .7fr .7fr auto;gap:7px;align-items:end;border-top:1px solid #eee;padding:9px 0; }.subject-edit label { font-size:11px; }.subject-edit input { width:100%;min-height:40px; }.subject-edit input[type=color] { padding:2px; }.message { min-height:22px;color:#28724d;font-weight:650; }.message.error { color:#a33a2d; }
    dialog { border:0;border-radius:17px;width:min(640px,calc(100% - 28px));max-height:90vh;padding:0;box-shadow:0 25px 80px #0006;color:var(--ink); }.dialog-inner { padding:27px;overflow:auto;max-height:90vh; }.dialog-head { display:flex;justify-content:space-between;gap:15px; }.dialog-head h2 { margin:5px 0;font:29px Georgia,serif; }.close { font-size:22px;padding:5px 13px; }.pill { display:inline-block;color:#fff;border-radius:20px;padding:5px 10px;font-size:11px;font-weight:750; }.detail-list li,.history li { margin:8px 0; }.resource { display:block;background:var(--soft);padding:12px;border-radius:8px;color:#245c4c;margin:6px 0; }.complete-control { width:100%;margin:15px 0; }.confidence { display:grid;grid-template-columns:repeat(4,1fr);gap:6px; }.confidence .selected { background:var(--brand);color:#fff; }.history { color:var(--muted);font-size:12px; }.note-area,.report-area { width:100%;min-height:100px;border:1px solid var(--line);border-radius:8px;padding:10px; }.report-area { min-height:260px; }.move-box { padding:10px;background:#f3f5f2;border-radius:9px;margin:10px 0; }.move-box input { min-height:44px; }
    @media(max-width:900px){ .today{grid-template-columns:1fr 1fr}.today-groups{grid-column:1/-1}.metrics{grid-template-columns:repeat(4,1fr)}.parent-grid{grid-template-columns:1fr}.subject-edit{grid-template-columns:45px 1fr 1fr}.subject-edit>*:nth-child(n+4){grid-row:2}.site-header{align-items:flex-start}.brand p{display:none} }
    @media(max-width:700px){ main{padding:12px}.site-header{display:block}.brand{margin-bottom:10px}nav button{flex:1}.today{grid-template-columns:1fr;padding:18px}.today-groups{grid-template-columns:1fr}.today h2{font-size:25px}.week-days{display:block}.day{margin:8px 0;min-height:0}.calendar-title{display:block}.metrics{grid-template-columns:repeat(2,1fr)}.subject-progress{grid-template-columns:1fr}.field-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.confidence{grid-template-columns:1fr 1fr}.recovery button,.recovery input{flex:1}.subject-edit{grid-template-columns:42px 1fr}.subject-edit>*:nth-child(n+3){grid-row:auto}.progress-row{grid-template-columns:10px 105px 1fr 35px} }
  </style>
</head>
<body>
  <!-- ==================== HTML SHELL ==================== -->
  <header class="site-header"><div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><div><h1>My GCSE Study Plan</h1><p>One clear step at a time</p></div></div><nav aria-label="Main views"><button id="student-tab" class="active" type="button">Student view</button><button id="parent-tab" type="button">Parent &amp; planning</button></nav></header>
  <main><div id="student-view"></div><div id="parent-view" class="hidden"></div><div id="calendar"></div></main>
  <dialog id="task-dialog" aria-labelledby="detail-title"><div class="dialog-inner" id="task-detail"></div></dialog>
  <dialog id="report-dialog" aria-labelledby="report-title"><div class="dialog-inner"><div class="dialog-head"><h2 id="report-title">Today’s report</h2><button class="close" data-close="report-dialog" aria-label="Close report">×</button></div><textarea id="report-text" class="report-area" readonly aria-label="Today's report"></textarea><div class="button-row"><button id="copy-report" class="primary">Copy for Discord</button></div><p id="copy-message" class="message" role="status"></p></div></dialog>

  <script>
  "use strict";
  /* ==================== DATE UTILITIES ==================== */
  const DAY_MS=86400000;
  function localISO(value=new Date()){ const d=new Date(value); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
  function fromISO(value){ return new Date(value+"T12:00:00"); }
  function addDays(value,count){ const d=fromISO(typeof value==="string"?value:localISO(value)); d.setDate(d.getDate()+count); return localISO(d); }
  function mondayOf(value=localISO()){ const d=fromISO(typeof value==="string"?value:localISO(value)); const day=d.getDay(); d.setDate(d.getDate()-(day===0?6:day-1)); return localISO(d); }
  function friendlyDate(value,weekday=true){ if(!value)return "Unscheduled"; return fromISO(value).toLocaleDateString("en-GB",{weekday:weekday?"long":undefined,day:"numeric",month:"long",year:"numeric"}); }
  function nextWeekDate(){ return addDays(mondayOf(),7); }
  function uid(){ return globalThis.crypto?.randomUUID?.() || "id-"+Date.now()+"-"+Math.random().toString(36).slice(2); }
  function escapeHTML(value=""){ return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])); }

  /* ==================== DATA SCHEMA + MIGRATION ==================== */
  const STORAGE_KEY="gcse-study-planner-v2";
  const LEGACY_KEYS=["gcse-study-planner-v1","gcsePlannerState","gcse-planner-state"];
  const defaultSubjects=[
    ["English Language","Eng Lang","#8d5a75","6","7"],["English Literature","Eng Lit","#6d5d8d","6","7"],["Maths","Maths","#3676a8","7","8"],["Science","Sci","#36845b","6-6","7-7"],["History","Hist","#b06c3d","6","7"],["Geography","Geog","#56856f","6","7"],["French","Fr","#b34d59","5","6"]
  ].map(([name,abbreviation,colour,currentGrade,targetGrade])=>({id:uid(),name,abbreviation,colour,currentGrade,targetGrade,active:true}));
  function normaliseSubject(subject){ return {id:subject.id||uid(),name:String(subject.name||"Subject"),abbreviation:String(subject.abbreviation||subject.name||"Sub").slice(0,12),colour:/^#[0-9a-f]{6}$/i.test(subject.colour||"")?subject.colour:"#668078",currentGrade:String(subject.currentGrade??""),targetGrade:String(subject.targetGrade??""),active:subject.active!==false}; }
  function normaliseTask(task,index=0){ const date=typeof task.date==="string"?task.date:""; return {id:String(task.id||uid()),subject:String(task.subject||"Other"),topic:String(task.topic||""),title:String(task.title||`Task ${index+1}`),type:task.type==="homework"?"homework":"revision",date,dueDate:String(task.dueDate||""),durationMinutes:Math.max(5,Number(task.durationMinutes||task.duration||20)),instructions:Array.isArray(task.instructions)?task.instructions.map(String):[],resources:Array.isArray(task.resources)?task.resources.filter(r=>r&&r.url).map(r=>({label:String(r.label||"Open resource"),url:String(r.url)})):[],priority:["low","normal","high"].includes(task.priority)?task.priority:"normal",status:["open","done","archived"].includes(task.status)?task.status:(task.completed?"done":"open"),confidence:["easy","ok","struggled","help"].includes(task.confidence)?task.confidence:"",notes:String(task.notes||""),originalDate:String(task.originalDate||date),completedAt:task.completedAt||"",recurrenceId:task.recurrenceId&&!['weekdays','weekly','selected'].includes(task.recurrenceId)?String(task.recurrenceId):"",recurrenceDate:String(task.recurrenceDate||date),postponements:Math.max(0,Number(task.postponements||0)),history:Array.isArray(task.history)?task.history:[],isExample:task.isExample===true}; }
  function validState(value){ return value&&typeof value==="object"&&Array.isArray(value.subjects)&&Array.isArray(value.tasks); }
  function migrateState(raw){
    if(!validState(raw)) throw new Error("This backup does not contain valid subjects and tasks arrays.");
    const subjects=raw.subjects.map(normaliseSubject);
    const legacyRecurring=new Map();
    const tasks=raw.tasks.map(normaliseTask).map(task=>{
      const old=raw.tasks.find(item=>String(item.id)===task.id);
      if(old&&["weekdays","weekly"].includes(old.recurrenceId)){ const ruleId="migrated-"+task.id; legacyRecurring.set(ruleId,{id:ruleId,type:old.recurrenceId,startDate:task.originalDate,weekdays:[],template:{...task,id:undefined,date:undefined,originalDate:undefined,recurrenceId:undefined,recurrenceDate:undefined,status:"open",history:[]},exceptions:[task.recurrenceDate]}); task.recurrenceId=ruleId; }
      return task;
    });
    return {version:2,subjects:subjects.length?subjects:defaultSubjects.map(s=>({...s,id:uid()})),tasks,recurringRules:[...(Array.isArray(raw.recurringRules)?raw.recurringRules:[]),...legacyRecurring.values()],settings:{calendarOffset:Number(raw.settings?.calendarOffset||0),...(raw.settings||{})}};
  }
  function freshState(){ const today=localISO(); const make=(data)=>normaliseTask({id:uid(),status:"open",priority:"normal",history:[{at:new Date().toISOString(),action:"Created",detail:"Example task"}],isExample:true,...data}); return {version:2,subjects:defaultSubjects.map(s=>({...s,id:uid()})),recurringRules:[],settings:{calendarOffset:0},tasks:[make({subject:"Science",topic:"Cell biology",title:"Cell structure practice",type:"revision",date:today,durationMinutes:20,instructions:["Review animal and plant cell structures.","Answer five exam questions.","Mark your answers and note one improvement."],resources:[]}),make({subject:"History",topic:"Germany",title:"The Kaiser",type:"revision",date:addDays(today,-1),durationMinutes:20,instructions:["Read your class notes.","Write three distinct points for a four-mark answer."]}),make({subject:"Maths",topic:"Number",title:"Non-calculator accuracy",type:"homework",date:addDays(today,2),dueDate:addDays(today,3),durationMinutes:30,instructions:["Complete the worksheet.","Check every answer without a calculator."]})]}; }

  /* ==================== STORAGE ==================== */
  function loadState(){
    const current=localStorage.getItem(STORAGE_KEY); if(current){ try{return migrateState(JSON.parse(current));}catch(error){console.warn("Could not load current planner",error);} }
    for(const key of LEGACY_KEYS){ const text=localStorage.getItem(key); if(text){ try{ const migrated=migrateState(JSON.parse(text)); localStorage.setItem(STORAGE_KEY,JSON.stringify(migrated)); return migrated; }catch(error){console.warn("Could not migrate",key,error);} } }
    return freshState();
  }
  let state=loadState(); let currentView="student"; let selectedTaskId="";
  function saveState(){ state.version=2; localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
  function commit(change,{generate=true}={}){ state=change(state)||state; if(generate)generateOccurrences(); saveState(); if(typeof document!=="undefined")renderAll(); }

  /* ==================== RECURRENCE ENGINE ==================== */
  function ruleApplies(rule,date){ const day=fromISO(date).getDay(); if(day===0||day===6||date<rule.startDate)return false; if(rule.type==="every-weekday")return true; if(rule.type==="weekly")return day===fromISO(rule.startDate).getDay(); return rule.type==="selected-weekdays"&&rule.weekdays.map(Number).includes(day); }
  function generateOccurrences(){ const start=mondayOf(addDays(localISO(),state.settings.calendarOffset*7)); const end=addDays(start,39); for(const rule of state.recurringRules.filter(r=>r.active!==false)){ rule.exceptions=Array.isArray(rule.exceptions)?rule.exceptions:[]; for(let date=start;date<=end;date=addDays(date,1)){ if(!ruleApplies(rule,date)||rule.exceptions.includes(date))continue; const exists=state.tasks.some(t=>t.recurrenceId===rule.id&&t.recurrenceDate===date); if(!exists){ const task=normaliseTask({...rule.template,id:uid(),date,originalDate:date,recurrenceId:rule.id,recurrenceDate:date,status:"open",confidence:"",completedAt:"",postponements:0,history:[{at:new Date().toISOString(),action:"Created",detail:"Recurring occurrence"}],isExample:false}); state.tasks.push(task); } } } }

  /* ==================== TASK ACTIONS ==================== */
  function updateTask(id,updater){ commit(s=>({...s,tasks:s.tasks.map(t=>t.id===id?updater({...t}):t)})); }
  function moveTask(id,newDate,label="Moved"){ updateTask(id,task=>{ const old=task.date||"later list"; if(task.recurrenceId&&task.recurrenceDate){ const rule=state.recurringRules.find(r=>r.id===task.recurrenceId); if(rule&&!rule.exceptions.includes(task.recurrenceDate))rule.exceptions.push(task.recurrenceDate); } task.date=newDate; task.postponements+=1; task.history.push({at:new Date().toISOString(),action:label,detail:`${old} → ${newDate||"Keep for later"}`}); return task; }); }
  function toggleComplete(id){ updateTask(id,task=>{ const done=task.status!=="done"; task.status=done?"done":"open"; task.completedAt=done?new Date().toISOString():""; if(!done)task.confidence=""; task.history.push({at:new Date().toISOString(),action:done?"Completed":"Reopened",detail:""}); return task; }); }
  function duplicateTask(id){ const source=state.tasks.find(t=>t.id===id); if(!source)return; const duplicate=normaliseTask({subject:source.subject,topic:source.topic,title:source.title+" (copy)",type:source.type,date:source.date,dueDate:source.dueDate,durationMinutes:source.durationMinutes,instructions:[...source.instructions],resources:source.resources.map(r=>({...r})),priority:source.priority,notes:"",status:"open",history:[{at:new Date().toISOString(),action:"Created",detail:`Duplicated from ${source.title}`}],isExample:false}); commit(s=>({...s,tasks:[...s.tasks,duplicate]})); }
  function clearExampleTasks(){ commit(s=>({...s,tasks:s.tasks.filter(task=>!task.isExample)})); }
  function saveTaskFromForm(form){
    const data=new FormData(form), id=String(data.get("id")||""), old=state.tasks.find(t=>t.id===id); const date=String(data.get("date")||"");
    const values={subject:String(data.get("subject")),topic:String(data.get("topic")),title:String(data.get("title")),type:String(data.get("type")),date,dueDate:String(data.get("dueDate")||""),durationMinutes:Number(data.get("durationMinutes")),priority:String(data.get("priority")),instructions:String(data.get("instructions")||"").split(/\n/).map(x=>x.trim()).filter(Boolean),resources:String(data.get("resources")||"").split(/\n/).map(line=>{const [label,...url]=line.split("|");return {label:(url.length?label:"Open resource").trim(),url:(url.length?url.join("|"):label).trim()};}).filter(r=>r.url),notes:String(data.get("notes")||"")};
    if(old){ updateTask(id,task=>{ if(task.date!==date){task.history.push({at:new Date().toISOString(),action:"Moved while editing",detail:`${task.date||"later list"} → ${date}`});task.postponements+=1;} return {...task,...values,originalDate:task.originalDate}; }); }
    else { const task=normaliseTask({...values,id:uid(),originalDate:date,history:[{at:new Date().toISOString(),action:"Created",detail:"Added by parent"}],isExample:false}); const recurrence=String(data.get("recurrence")); if(recurrence!=="none"){ const ruleId=uid(), weekdays=[...form.querySelectorAll('[name="weekdays"]:checked')].map(i=>Number(i.value)); const rule={id:ruleId,type:recurrence,startDate:date,weekdays,active:true,exceptions:[],template:{...values,date:undefined,originalDate:undefined}}; task.recurrenceId=ruleId;task.recurrenceDate=date; commit(s=>({...s,tasks:[...s.tasks,task],recurringRules:[...s.recurringRules,rule]})); } else commit(s=>({...s,tasks:[...s.tasks,task]})); }
    form.reset(); renderAll();
  }

  /* ==================== SELECTORS / DERIVED STATE ==================== */
  const activeTasks=()=>state.tasks.filter(t=>t.status!=="archived");
  const tasksOn=date=>activeTasks().filter(t=>t.date===date);
  const missedTasks=()=>activeTasks().filter(t=>t.status==="open"&&t.date&&t.date<localISO());
  function subjectFor(name){ return state.subjects.find(s=>s.name===name)||{name,abbreviation:name.slice(0,8),colour:"#668078",active:false}; }
  function sixWeekDays(){ const start=mondayOf(addDays(localISO(),state.settings.calendarOffset*7)),days=[]; for(let week=0;week<6;week++)for(let day=0;day<5;day++)days.push(addDays(start,week*7+day)); return days; }
  function taskCard(task,calendar=false){ const status=task.status==="done"?"✓ Completed":task.date&&task.date<localISO()?"! Missed":"○ Not completed"; return `<button class="task-card ${task.status==='done'?'done':''} ${task.status==='open'&&task.date&&task.date<localISO()?'missed':''} ${calendar?'calendar-task':''}" style="--subject:${subjectFor(task.subject).colour};${calendar?`--task-height:${Math.max(58,task.durationMinutes*1.25)}px`:''}" data-open-task="${escapeHTML(task.id)}"><span class="status" aria-hidden="true">${status.slice(0,1)}</span><span><strong>${escapeHTML(subjectFor(task.subject).abbreviation)} · ${escapeHTML(task.title)}</strong><small>${task.durationMinutes} min · ${escapeHTML(task.type==='homework'?'Homework':'Revision')} · ${status}</small></span></button>`; }

  /* ==================== STUDENT VIEW ==================== */
  function renderStudent(){ const today=localISO(),items=tasksOn(today),planned=items.reduce((n,t)=>n+t.durationMinutes,0),done=items.filter(t=>t.status==="done").length; const groups=["homework","revision"].map(type=>{const list=items.filter(t=>t.type===type);return list.length?`<section><h3>${type.toUpperCase()}</h3>${list.map(t=>taskCard(t)).join("")}</section>`:"";}).join(""); const missed=missedTasks(); document.querySelector("#student-view").innerHTML=`<section class="today"><div><div class="eyebrow">Today</div><h2>${friendlyDate(today)}</h2><p class="today-summary"><b>${planned} minutes planned</b> · ${done} of ${items.length} finished</p></div><div class="today-groups">${groups||'<p class="empty" style="color:#dbeae5">Nothing is planned today.</p>'}</div><button id="make-report">Generate today’s report</button></section>${missed.length?`<section class="panel needs"><h2>Needs Doing <span class="count">${missed.length}</span></h2><p>Missed work stays recoverable here until you choose a sensible time. It is never moved automatically.</p>${missed.map(recoveryCard).join("")}</section>`:""}`; }
  function recoveryCard(task){ return `<div class="recovery"><div class="recovery-info"><b>${escapeHTML(task.subject)} — ${escapeHTML(task.title)}</b><small>${task.durationMinutes} min · Originally ${friendlyDate(task.originalDate,false)}</small></div><button data-move="${task.id}" data-date="${localISO()}">Do today</button><button data-move="${task.id}" data-date="${addDays(localISO(),1)}">Tomorrow</button><label><span class="hidden">Move to date</span><input type="date" data-custom-move="${task.id}" aria-label="Move ${escapeHTML(task.title)} to date"></label><button data-move="${task.id}" data-date="${nextWeekDate()}">Next week</button><button data-move="${task.id}" data-date="">Keep for later</button></div>`; }

  /* ==================== PARENT VIEW ==================== */
  function renderParent(){ const start=mondayOf(),end=addDays(start,4),week=activeTasks().filter(t=>t.date>=start&&t.date<=end),done=week.filter(t=>t.status==="done"),review=activeTasks().filter(t=>t.confidence==="help"||t.confidence==="struggled"||t.postponements>=2); const metrics=[[week.length,"Tasks planned"],[done.length,"Completed"],[week.length-done.length,"Outstanding"],[week.reduce((n,t)=>n+t.durationMinutes,0),"Minutes planned"],[done.reduce((n,t)=>n+t.durationMinutes,0),"Minutes completed"],[`${week.length?Math.round(done.length/week.length*100):0}%`,"Completion"],[activeTasks().filter(t=>t.confidence==="help").length,"Need Help"],[activeTasks().filter(t=>t.postponements>=2).length,"Repeatedly postponed"]]; document.querySelector("#parent-view").innerHTML=`<section class="panel"><h2>This week at a glance</h2><div class="metrics">${metrics.map(m=>`<div class="metric"><strong>${m[0]}</strong><span>${m[1]}</span></div>`).join("")}</div><h3>Progress by subject</h3><div class="subject-progress">${state.subjects.map(subject=>{const all=activeTasks().filter(t=>t.subject===subject.name),finished=all.filter(t=>t.status==="done").length;return `<div class="progress-row"><i class="dot" style="background:${subject.colour}"></i><b>${escapeHTML(subject.name)}</b><progress value="${finished}" max="${all.length||1}" aria-label="${escapeHTML(subject.name)} progress"></progress><small>${finished}/${all.length}</small></div>`}).join("")}</div></section><div class="parent-grid"><section class="panel editor">${taskForm()}</section><section class="panel review"><h2>Parent Review</h2>${review.length?review.map(t=>`<div class="review-item"><b>${escapeHTML(t.subject)}: ${escapeHTML(t.title)}</b><p>${t.confidence==='help'?'🔴 Need help':t.confidence==='struggled'?'😕 Struggled':`↗ Moved ${t.postponements} times`}</p><small>${escapeHTML(t.notes||"No student note.")}</small></div>`).join(""):'<p class="empty">Nothing needs review.</p>'}<h2>Backup</h2><div class="button-row"><button id="export-json">Export JSON</button><button id="export-csv">Export CSV</button><label class="button">Import JSON<input id="import-json" class="hidden" type="file" accept="application/json,.json"></label><button id="clear-examples" class="danger">Clear example data</button></div><p id="backup-message" class="message" role="status"></p></section></div><section class="panel settings"><h2>Subjects</h2><p>Edit the central list. Inactive subjects remain on old tasks but disappear from the task form.</p><div id="subjects">${state.subjects.map(subjectRow).join("")}</div><button id="add-subject">Add subject</button></section>`; }
  function taskForm(task={}){ const options=state.subjects.filter(s=>s.active||s.name===task.subject).map(s=>`<option ${s.name===task.subject?'selected':''}>${escapeHTML(s.name)}</option>`).join(""); return `<h2>${task.id?'Edit task':'Plan a task'}</h2><form id="task-form"><input type="hidden" name="id" value="${escapeHTML(task.id||'')}"><div class="field-grid"><label class="field">Subject<select name="subject" required><option value="">Choose…</option>${options}</select></label><label class="field">Topic<input name="topic" value="${escapeHTML(task.topic||'')}"></label><label class="field full">Short title<input name="title" required value="${escapeHTML(task.title||'')}"></label><label class="field">Type<select name="type"><option value="revision" ${task.type!=='homework'?'selected':''}>Revision</option><option value="homework" ${task.type==='homework'?'selected':''}>Homework</option></select></label><label class="field">Scheduled date<input name="date" type="date" required value="${task.date||localISO()}"></label><label class="field">Homework due date<input name="dueDate" type="date" value="${task.dueDate||''}"></label><label class="field">Estimated minutes<input name="durationMinutes" type="number" min="5" step="5" required value="${task.durationMinutes||20}"></label><label class="field">Priority<select name="priority">${['low','normal','high'].map(p=>`<option ${p===(task.priority||'normal')?'selected':''}>${p}</option>`).join('')}</select></label>${task.id?'':`<label class="field">Recurrence<select name="recurrence" id="recurrence"><option value="none">Does not repeat</option><option value="every-weekday">Every weekday</option><option value="weekly">Weekly</option><option value="selected-weekdays">Selected weekdays</option></select></label><div class="field full hidden" id="weekday-field"><span class="field">Repeat on selected weekdays</span><div class="weekday-picker">${['Mon','Tue','Wed','Thu','Fri'].map((d,i)=>`<label><input type="checkbox" name="weekdays" value="${i+1}"> ${d}</label>`).join('')}</div></div>`}<label class="field full">Instructions (one numbered step per line)<textarea name="instructions">${escapeHTML((task.instructions||[]).join('\n'))}</textarea></label><label class="field full">Resources (one per line: Friendly name | https://…)<textarea name="resources">${escapeHTML((task.resources||[]).map(r=>`${r.label} | ${r.url}`).join('\n'))}</textarea></label><label class="field full">Notes<textarea name="notes">${escapeHTML(task.notes||'')}</textarea></label></div><div class="button-row"><button class="primary" type="submit">${task.id?'Save changes':'Add to plan'}</button>${task.id?'<button type="button" id="cancel-edit">Cancel edit</button>':''}</div></form>`; }
  function subjectRow(s){ return `<div class="subject-edit" data-subject="${s.id}"><label>Colour<input type="color" data-key="colour" value="${s.colour}"></label><label>Name<input data-key="name" value="${escapeHTML(s.name)}"></label><label>Abbreviation<input data-key="abbreviation" value="${escapeHTML(s.abbreviation)}"></label><label>Current grade<input data-key="currentGrade" value="${escapeHTML(s.currentGrade)}"></label><label>Target grade<input data-key="targetGrade" value="${escapeHTML(s.targetGrade)}"></label><label><input type="checkbox" data-key="active" ${s.active?'checked':''}> Active</label></div>`; }

  /* ==================== CALENDAR ==================== */
  function renderCalendar(){ const days=sixWeekDays(),start=days[0],end=days.at(-1); document.querySelector("#calendar").innerHTML=`<section class="calendar"><div class="calendar-title"><div><div class="eyebrow">Six-week plan</div><h2>${friendlyDate(start,false)} – ${friendlyDate(end,false)}</h2></div><div class="button-row"><button data-window="-1">← Previous</button><button data-window="0">This week</button><button data-window="1">Next →</button></div></div>${Array.from({length:6},(_,week)=>{const weekDays=days.slice(week*5,week*5+5),isCurrent=weekDays.includes(localISO());return `<section class="week ${isCurrent?'current-week':''}"><h3>${isCurrent?'Current week':`Week of ${friendlyDate(weekDays[0],false)}`}</h3><div class="week-days">${weekDays.map(renderDay).join('')}</div></section>`}).join('')}</section>`; }
  function renderDay(date){ const items=tasksOn(date),minutes=items.reduce((n,t)=>n+t.durationMinutes,0),d=fromISO(date); return `<article class="day ${date===localISO()?'today-day':''} ${minutes>60?'overload':''}" data-drop-date="${date}"><header><b>${d.toLocaleDateString('en-GB',{weekday:'short'})}</b><span>${d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span></header><span class="day-total">${minutes} min planned${minutes>60?' · Over 60 min':''}</span><div class="workload" aria-label="${minutes} of a normal 60-minute day"><span style="width:${Math.min(100,minutes/60*100)}%"></span></div>${items.map(t=>taskCard(t,true)).join('')}</article>`; }

  /* ==================== MODALS ==================== */
  function openTask(id){ selectedTaskId=id; renderTaskDialog(); document.querySelector('#task-dialog').showModal(); document.querySelector('#task-dialog .close').focus(); }
  function renderTaskDialog(){ const task=state.tasks.find(t=>t.id===selectedTaskId); if(!task)return closeDialog('task-dialog'); const subject=subjectFor(task.subject); document.querySelector('#task-detail').innerHTML=`<div class="dialog-head"><div><span class="pill" style="background:${subject.colour}">${escapeHTML(task.subject)}</span><h2 id="detail-title">${escapeHTML(task.title)}</h2><p>${escapeHTML(task.topic||'General')} · ${task.durationMinutes} minutes · ${escapeHTML(task.type)}</p></div><button class="close" data-close="task-dialog" aria-label="Close task details">×</button></div><h3>What to do</h3>${task.instructions.length?`<ol class="detail-list">${task.instructions.map(i=>`<li>${escapeHTML(i)}</li>`).join('')}</ol>`:'<p class="empty">No instructions added.</p>'}<h3>Resources</h3>${task.resources.length?task.resources.map(r=>`<a class="resource" href="${escapeHTML(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(r.label)} ↗</a>`).join(''):'<p class="empty">Everything needed is in the instructions.</p>'}<button class="complete-control primary" data-complete="${task.id}">${task.status==='done'?'✓ Completed — reopen task':'○ Mark as complete'}</button>${task.status==='done'?`<h3>How did it feel?</h3><div class="confidence">${[['easy','👍 Easy'],['ok','🙂 OK'],['struggled','😕 Struggled'],['help','🔴 Need help']].map(([v,l])=>`<button data-confidence="${v}" class="${task.confidence===v?'selected':''}">${l}</button>`).join('')}</div>`:''}<label class="field">Student note<textarea class="note-area" id="student-note" placeholder="Add a note for your parent…">${escapeHTML(task.notes)}</textarea></label><h3>History</h3><ul class="history"><li>Originally scheduled ${friendlyDate(task.originalDate)}</li>${task.history.map(h=>`<li>${escapeHTML(h.action)}${h.detail?' — '+escapeHTML(h.detail):''} · ${new Date(h.at).toLocaleString('en-GB')}</li>`).join('')}</ul><div class="move-box"><b>Move task</b><div class="button-row"><button data-move="${task.id}" data-date="${localISO()}">Today</button><button data-move="${task.id}" data-date="${addDays(localISO(),1)}">Tomorrow</button><input type="date" data-custom-move="${task.id}" value="${task.date}" aria-label="Move task to date"></div></div>${currentView==='parent'?`<div class="button-row"><button data-edit="${task.id}">Edit</button><button data-duplicate="${task.id}">Duplicate</button><button class="danger" data-archive="${task.id}">Archive</button></div>`:''}`; }
  function closeDialog(id){ const dialog=document.getElementById(id);if(dialog.open)dialog.close(); }

  /* ==================== IMPORT / EXPORT ==================== */
  function download(name,content,type){ const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),0); }
  function exportJSON(){ download('gcse-study-plan.json',JSON.stringify(state,null,2),'application/json'); }
  function exportCSV(){ const columns=['Subject','Topic','Title','Type','Date','Original date','Due date','Minutes','Priority','Status','Confidence','Postponements','Notes']; const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"'; download('gcse-tasks.csv',[columns,...state.tasks.map(t=>[t.subject,t.topic,t.title,t.type,t.date,t.originalDate,t.dueDate,t.durationMinutes,t.priority,t.status,t.confidence,t.postponements,t.notes])].map(row=>row.map(quote).join(',')).join('\n'),'text/csv'); }
  async function importJSON(file){ const message=document.querySelector('#backup-message'); try{ const parsed=JSON.parse(await file.text()); const imported=migrateState(parsed); state=imported;generateOccurrences();saveState();renderAll();document.querySelector('#backup-message').textContent='Backup imported successfully.'; }catch(error){ message.textContent=`Import failed: ${error.message}. Existing data was not changed.`;message.classList.add('error'); } }
  function makeReport(){ const items=tasksOn(localISO()),planned=items.reduce((n,t)=>n+t.durationMinutes,0),complete=items.filter(t=>t.status==='done'),confidence={easy:'Easy',ok:'OK',struggled:'Struggled',help:'Need help'}; return `TODAY’S GCSE WORK — ${friendlyDate(localISO())}\n\nCOMPLETED\n${complete.map(t=>`✅ ${t.subject} — ${t.title} — ${t.durationMinutes} min${t.confidence?` — ${confidence[t.confidence]}`:''}`).join('\n')||'None yet.'}\n\nSTILL TO DO\n${items.filter(t=>t.status!=='done').map(t=>`○ ${t.subject} — ${t.title} — ${t.durationMinutes} min`).join('\n')||'Nothing outstanding.'}\n\nPlanned: ${planned} minutes\nCompleted: ${complete.reduce((n,t)=>n+t.durationMinutes,0)} minutes`; }
  async function copyReport(){ const area=document.querySelector('#report-text'),message=document.querySelector('#copy-message'); try{ if(!navigator.clipboard?.writeText)throw new Error(); await navigator.clipboard.writeText(area.value);message.textContent='Copied.'; }catch{ area.focus();area.select();message.textContent='Clipboard access is unavailable. The report is selected — use Ctrl/Cmd+C to copy.'; } }

  /* ==================== APP INITIALISATION / EVENTS ==================== */
  function renderAll(){ renderStudent();renderParent();renderCalendar(); if(document.querySelector('#task-dialog').open&&selectedTaskId)renderTaskDialog(); bindDirectEvents(); }
  function bindDirectEvents(){ document.querySelector('#task-form')?.addEventListener('submit',event=>{event.preventDefault();saveTaskFromForm(event.currentTarget);}); document.querySelector('#recurrence')?.addEventListener('change',event=>document.querySelector('#weekday-field').classList.toggle('hidden',event.target.value!=='selected-weekdays')); document.querySelector('#make-report')?.addEventListener('click',()=>{document.querySelector('#report-text').value=makeReport();document.querySelector('#report-dialog').showModal();document.querySelector('#report-dialog .close').focus();}); document.querySelector('#export-json')?.addEventListener('click',exportJSON);document.querySelector('#export-csv')?.addEventListener('click',exportCSV);document.querySelector('#import-json')?.addEventListener('change',e=>e.target.files[0]&&importJSON(e.target.files[0])); document.querySelector('#clear-examples')?.addEventListener('click',()=>{if(confirm('Delete only the example tasks?'))clearExampleTasks();}); document.querySelector('#add-subject')?.addEventListener('click',()=>commit(s=>({...s,subjects:[...s.subjects,normaliseSubject({name:'New subject',abbreviation:'New',colour:'#668078',active:true})]}))); }
  if(typeof document!=="undefined") document.addEventListener('click',event=>{ const target=event.target.closest('button,[data-open-task]');if(!target)return; if(target.dataset.openTask)openTask(target.dataset.openTask); if(target.dataset.close)closeDialog(target.dataset.close); if(target.dataset.complete){toggleComplete(target.dataset.complete);renderTaskDialog();} if(target.dataset.confidence)updateTask(selectedTaskId,t=>{t.confidence=target.dataset.confidence;t.history.push({at:new Date().toISOString(),action:'Confidence recorded',detail:target.dataset.confidence});return t;}); if(target.dataset.move!==undefined){moveTask(target.dataset.move,target.dataset.date); if(document.querySelector('#task-dialog').open)renderTaskDialog();} if(target.dataset.duplicate){duplicateTask(target.dataset.duplicate);closeDialog('task-dialog');} if(target.dataset.archive){updateTask(target.dataset.archive,t=>({...t,status:'archived'}));closeDialog('task-dialog');} if(target.dataset.edit){const task=state.tasks.find(t=>t.id===target.dataset.edit);closeDialog('task-dialog');document.querySelector('.editor').innerHTML=taskForm(task);bindDirectEvents();document.querySelector('.editor').scrollIntoView({behavior:'smooth'});} if(target.id==='cancel-edit'){renderParent();bindDirectEvents();} if(target.dataset.window){state.settings.calendarOffset=target.dataset.window==='0'?0:state.settings.calendarOffset+Number(target.dataset.window);generateOccurrences();saveState();renderAll();} });
  if(typeof document!=="undefined") document.addEventListener('change',event=>{ if(event.target.dataset.customMove){moveTask(event.target.dataset.customMove,event.target.value);if(document.querySelector('#task-dialog').open)renderTaskDialog();} const row=event.target.closest('[data-subject]');if(row&&event.target.dataset.key){const key=event.target.dataset.key,value=event.target.type==='checkbox'?event.target.checked:event.target.value;commit(s=>({...s,subjects:s.subjects.map(subject=>subject.id===row.dataset.subject?{...subject,[key]:value}:subject)}),{generate:false});} });
  if(typeof document!=="undefined") document.addEventListener('input',event=>{ if(event.target.id==='student-note'&&selectedTaskId){const task=state.tasks.find(t=>t.id===selectedTaskId);if(task){task.notes=event.target.value;saveState();}} });
  function switchView(view){currentView=view;document.querySelector('#student-view').classList.toggle('hidden',view!=='student');document.querySelector('#parent-view').classList.toggle('hidden',view!=='parent');document.querySelector('#student-tab').classList.toggle('active',view==='student');document.querySelector('#parent-tab').classList.toggle('active',view==='parent');renderCalendar();}
  if(typeof document!=="undefined"){
    document.querySelector('#student-tab').addEventListener('click',()=>switchView('student'));document.querySelector('#parent-tab').addEventListener('click',()=>switchView('parent'));document.querySelector('#copy-report').addEventListener('click',copyReport);
    document.querySelectorAll('dialog').forEach(dialog=>dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close();}));
    generateOccurrences();saveState();renderAll();switchView('student');
  }
  globalThis.PlannerTestAPI={getState:()=>structuredClone(state),setState:value=>{state=migrateState(value);saveState();},updateTask,moveTask,toggleComplete,duplicateTask,clearExampleTasks,generateOccurrences,makeReport,migrateState,localISO,addDays,mondayOf,nextWeekDate};
  </script>
</body>
</html>
